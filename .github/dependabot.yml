version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    ignore:
      # Home Assistant pins its dependency closure exactly, so bumping anything
      # it owns cannot resolve. These reach CI only through the test harness;
      # the integration itself ships no requirements. They move when the pinned
      # Home Assistant version moves.
      - dependency-name: homeassistant
      - dependency-name: cryptography
