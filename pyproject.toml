[project]
name = "hermes-conversation"
version = "0.3.2"
description = "Home Assistant conversation agent backed by a Hermes profile"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mark Niehe" }]
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component==0.13.356",
  # Requirements of the `conversation` component we depend on; pytest-hacc
  # installs Home Assistant but not the components' own requirements.
  "hassil==3.12.0",
  "home-assistant-intents==2026.8.25",
  "ruff>=0.14",
  "mypy>=1.14",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RET", "PL", "RUF", "ANN", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
# Home Assistant's __all__ omits symbols its own integrations import from the
# package root (AbstractConversationAgent among them), so strict mode's
# no-implicit-reexport fires on correct, core-matching code.
[[tool.mypy.overrides]]
module = ["homeassistant.*"]
no_implicit_reexport = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
